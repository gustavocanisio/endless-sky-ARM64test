name: Build ARM64
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build \
            libsdl2-dev libpng-dev libjpeg-dev libglew-dev \
            libopenal-dev uuid-dev libgles2-mesa-dev libegl1-mesa-dev \
            libavif-dev libflac++-dev libminizip-dev libmad0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DES_GLES=ON
      - name: Compile
        run: cmake --build build -j$(nproc)
      - name: Check linked libraries
        run: readelf -d build/endless-sky | grep NEEDED
      - name: Package libraries
        run: |
          mkdir -p dist/lib
          cp build/endless-sky dist/
          ldd build/endless-sky | grep "=> /" | awk '{print $3}' | while read lib; do
            cp -v "$lib" dist/lib/
          done
      - name: Send artefact
        uses: actions/upload-artifact@v4
        with:
          name: endless-sky-arm64
          path: dist/
