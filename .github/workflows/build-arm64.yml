name: Build ARM64
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build \
            libsdl2-dev libpng-dev libjpeg-dev libglew-dev \
            libopenal-dev uuid-dev libgles2-mesa-dev \
            libavif-dev libflac++-dev libminizip-dev libmad0-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DES_GLES=ON
      - name: Ver opções de GLES no CMakeLists
        run: grep -n -i "GLES\|OPENGL_ES\|find_package(OpenGL" CMakeLists.txt
